<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tortoise</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f1f0f9;--panel:#fff;--ink:#1c1846;--mute:#6b6894;--line:#e0def2;--acc:#5b3df5;--acc-ink:#fff;--soft:#ebe7ff;--warn:#b86e00;--warn-bg:#fff2d6;--ok:#0d7a4f;--ok-bg:#dcf5e8;--bad:#b42318;--bad-bg:#fde7e4}
@media(prefers-color-scheme:dark){:root{--bg:#12102b;--panel:#1b1840;--ink:#ecebff;--mute:#9d9ac9;--line:#2d2a5c;--acc:#8b74ff;--acc-ink:#12102b;--soft:#272356;--warn:#ffc266;--warn-bg:#3a2d10;--ok:#6fe0aa;--ok-bg:#12342a;--bad:#ff9b92;--bad-bg:#3d1a18}}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.55 Inter,"Segoe UI",system-ui,sans-serif}
h1,h2,h3{font-family:"Bricolage Grotesque","Segoe UI",sans-serif;margin:0;letter-spacing:-.02em}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
label{display:block;font-weight:500;margin:14px 0 5px}
.btn{background:var(--acc);color:var(--acc-ink);border:0;border-radius:8px;padding:11px 18px;font-weight:600;cursor:pointer}
.btn:disabled{opacity:.55;cursor:wait}.btn.ghost{background:transparent;color:var(--acc);border:1px solid var(--line)}
.hidden{display:none!important}.mute{color:var(--mute)}
/* onboarding */
#gate{min-height:100%;display:grid;grid-template-columns:1.1fr 1fr;gap:56px;align-items:center;max-width:1080px;margin:0 auto;padding:40px 28px}
#gate h1{font-size:clamp(34px,5vw,58px);line-height:1.02;font-weight:700}
#gate .lead{font-size:18px;color:var(--mute);max-width:30ch;margin-top:18px}
.form{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:26px}
.err{background:var(--bad-bg);color:var(--bad);padding:10px 12px;border-radius:8px;margin-top:14px;font-size:14px}
.note{background:var(--warn-bg);color:var(--warn);padding:10px 12px;border-radius:8px;margin-top:14px;font-size:14px}
#log{list-style:none;margin:18px 0 0;padding:0}
#log li{padding:7px 0 7px 26px;position:relative;color:var(--mute)}
#log li::before{content:"";position:absolute;left:4px;top:13px;width:10px;height:10px;border-radius:50%;border:2px solid var(--acc)}
#log li.done{color:var(--ink)}#log li.done::before{background:var(--acc)}
#log li.now::before{animation:pulse 1.1s infinite}
@keyframes pulse{50%{transform:scale(1.7);opacity:.35}}
@media(prefers-reduced-motion:reduce){#log li.now::before{animation:none}}
/* app shell */
#app{display:grid;grid-template-columns:270px 1fr;min-height:100%}
#rail{background:var(--panel);border-right:1px solid var(--line);padding:22px 14px;position:sticky;top:0;height:100vh;overflow:auto}
#rail h2{font-size:20px;padding:0 10px}#rail .dom{padding:0 10px 14px;font-size:13px}
.nav{display:flex;width:100%;gap:10px;align-items:center;text-align:left;background:none;border:0;border-radius:8px;padding:10px;cursor:pointer}
.nav:hover{background:var(--soft)}.nav[aria-current=true]{background:var(--soft);font-weight:600}
.nav small{display:block;font-weight:400;color:var(--mute)}
.av{width:32px;height:32px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-weight:700;color:var(--acc);flex:none}
.nav[aria-current=true] .av{background:var(--acc);color:var(--acc-ink)}
.sep{height:1px;background:var(--line);margin:12px 10px}
main{padding:34px clamp(18px,4vw,52px) 60px;max-width:980px;width:100%}
main h2{font-size:30px}.sub{color:var(--mute);margin:6px 0 22px;max-width:62ch}
.sec{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px 22px;margin-bottom:16px}
.sec h3{font-size:17px;margin-bottom:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{background:var(--soft);border-radius:999px;padding:4px 12px;font-size:13px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
ul.tight{margin:0;padding-left:18px}ul.tight li{margin:4px 0}
pre.welcome{white-space:pre-wrap;font:inherit;margin:0}
.run{display:flex;gap:10px;margin-bottom:16px}.run input{flex:1}
.working{display:flex;align-items:center;gap:12px;padding:16px;border:1px dashed var(--line);border-radius:10px;color:var(--mute);margin-bottom:16px}
.bar{height:4px;flex:1;background:var(--soft);border-radius:4px;overflow:hidden;position:relative}
.bar::after{content:"";position:absolute;inset:0;width:35%;background:var(--acc);animation:slide 1.3s infinite ease-in-out}
@keyframes slide{from{transform:translateX(-100%)}to{transform:translateX(300%)}}
@media(prefers-reduced-motion:reduce){.bar::after{animation:none;width:100%;opacity:.4}}
.doc{line-height:1.7}.doc h2,.doc h3,.doc h4{margin:18px 0 6px}.doc a{color:var(--acc)}
.meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:13px;color:var(--mute)}
.pill{padding:2px 10px;border-radius:999px;font-size:12px;font-weight:600;background:var(--warn-bg);color:var(--warn)}
.co{display:grid;grid-template-columns:1fr auto;gap:4px 16px;padding:14px 0;border-top:1px solid var(--line)}
.co:first-child{border-top:0}.co b{font-size:16px}.score{background:var(--ok-bg);color:var(--ok);font-weight:700;border-radius:8px;padding:2px 10px;height:fit-content}
.co p{margin:2px 0;grid-column:1/-1}.co a{color:var(--acc);word-break:break-all}
.day{margin:18px 0 4px;font-weight:600;color:var(--mute);font-size:13px}
.pill.ok{background:var(--ok-bg);color:var(--ok)}.pill.bad{background:var(--bad-bg);color:var(--bad)}
.cmd{margin-bottom:16px}.cmd textarea{margin-bottom:10px}
.vid{border-top:1px solid var(--line);padding:14px 0 4px;margin-top:14px}.vid a{color:var(--acc);word-break:break-all}
ol.scenes{margin:8px 0;padding-left:20px}ol.scenes li{margin:8px 0}
.lbl{font-size:12px;font-weight:600;color:var(--mute);text-transform:uppercase;letter-spacing:.04em}
.post{white-space:pre-wrap;margin:6px 0 0}
.diff{white-space:pre-wrap;font:13px/1.5 ui-monospace,Consolas,monospace;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;margin:12px 0;overflow:auto}
.diff .add{color:var(--ok)}.diff .del{color:var(--bad)}
.rule{border-top:1px solid var(--line);padding:14px 0}.rule:first-child{border-top:0;padding-top:0}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:9}
@media(max-width:860px){#gate{grid-template-columns:1fr;gap:28px}#app{grid-template-columns:1fr}#rail{position:static;height:auto}.row2{grid-template-columns:1fr}}
</style>
</head>
<body>

<section id="gate">
  <div>
    <h1>Tortoise. Sign in with your work email. Your marketing team briefs itself.</h1>
    <p class="lead">It reads your company's public footprint, then trains five agents on how to market it.</p>
  </div>
  <div class="form">
    <form id="f">
      <label for="email">Work email</label>
      <input id="email" type="email" placeholder="you@yourcompany.com" required>
      <div class="row2">
        <div><label for="role">Your role</label><input id="role" placeholder="Founder"></div>
        <div><label for="lang">Language</label>
          <select id="lang"><option selected>English</option><option>Hinglish</option><option>Hindi</option></select></div>
      </div>
      <div id="extra" class="hidden">
        <div class="note">This is a personal email, so tell me which company to research.</div>
        <label for="cname">Company name</label><input id="cname">
        <label for="web">Website</label><input id="web" placeholder="https://yourcompany.com">
      </div>
      <div id="ferr" class="err hidden"></div>
      <p><button class="btn" id="go" style="width:100%;margin-top:18px">Brief my team</button></p>
    </form>
    <ul id="log" class="hidden"></ul>
    <div id="existing" class="hidden"><p class="mute" style="margin:18px 0 6px">Or open a workspace you already set up</p><select id="ws"></select></div>
  </div>
</section>

<div id="app" class="hidden">
  <nav id="rail" aria-label="Team">
    <h2 id="cname-h"></h2><div class="dom mute" id="dom"></div>
    <div id="nav"></div>
    <div class="sep"></div>
    <button class="nav" id="switch"><span class="av">+</span>Switch company</button>
  </nav>
  <main id="view"></main>
</div>
<div id="toast" class="toast hidden"></div>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const AGENTS={strategy:["St","Strategy","30-day plan and positioning"],research:["Re","Research","10 new companies every morning"],
  blog:["Bl","Blog","Sourced, SEO-ready drafts"],social:["So","Social","LinkedIn and Instagram drafts"],analytics:["An","Analytics","Weekly what-worked review"],
  content:["Co","Content","Campaign package from a request"]};
const PLAT={linkedin:"LinkedIn",instagram:"Instagram",x:"X",youtube:"YouTube",facebook:"Facebook"};
const STATUS={draft:["Draft",""],approved:["Approved","ok"],rejected:["Rejected","bad"]};
let T=null,cur="brief",busy=false;

async function api(path,opt){
  const r=await fetch(path,opt);let d=null;try{d=await r.json()}catch{}
  if(!r.ok)throw Object.assign(new Error(typeof d?.detail==="string"?d.detail:"Request failed ("+r.status+")"),{status:r.status});
  return d;
}
const post=(p,b)=>api(p,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(b||{})});
function toast(t){const e=$("#toast");e.textContent=t;e.classList.remove("hidden");setTimeout(()=>e.classList.add("hidden"),3500)}
function md(s){let h=esc(s);
  h=h.replace(/^### (.*)$/gm,"<h4>$1</h4>").replace(/^## (.*)$/gm,"<h3>$1</h3>").replace(/^# (.*)$/gm,"<h2>$1</h2>")
   .replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>')
   .replace(/^\s*[-*] (.*)$/gm,"<li>$1</li>").replace(/(<li>.*<\/li>\n?)+/g,m=>"<ul class='tight'>"+m+"</ul>").replace(/\n{2,}/g,"<br><br>");
  return h}

/* ---------- onboarding ---------- */
const STAGES=["Reading your website","Checking your LinkedIn and Instagram","Finding competitors","Studying your industry","Writing the company brief","Training the five agents"];
let stageTimer=null;
function startLog(){const l=$("#log");l.innerHTML="";l.classList.remove("hidden");let i=0;
  const add=()=>{l.querySelectorAll(".now").forEach(x=>x.className="done");if(i<STAGES.length){const li=document.createElement("li");li.className="now";li.textContent=STAGES[i++];l.appendChild(li)}};
  add();stageTimer=setInterval(add,14000)}
function stopLog(){clearInterval(stageTimer);$("#log").querySelectorAll("li").forEach(x=>x.className="done")}

$("#f").addEventListener("submit",async e=>{
  e.preventDefault();$("#ferr").classList.add("hidden");$("#go").disabled=true;
  try{
    const r=await post("/onboard",{work_email:$("#email").value.trim(),user_role:$("#role").value||null,language:$("#lang").value,
      company_name:$("#cname").value||null,website:$("#web").value||null});
    if(r.status==="ready")return openTenant(r.tenant_id);
    startLog();poll(r.tenant_id);
  }catch(err){
    $("#go").disabled=false;
    if(err.status===422){$("#extra").classList.remove("hidden");$("#cname").focus()}
    else{const x=$("#ferr");x.textContent=err.message;x.classList.remove("hidden")}
  }
});
async function poll(id){
  let misses=0;
  const fail=msg=>{clearInterval(stageTimer);$("#go").disabled=false;
    const x=$("#ferr");x.textContent=msg;x.classList.remove("hidden")};
  const tick=async()=>{
    try{const t=await api("/tenants/"+id);misses=0;
      if(t.status==="ready"){stopLog();return setTimeout(()=>openTenant(id),600)}
      if(t.status==="failed")return fail("Research failed: "+(t.error||"unknown error")+". Fix the setting in .env and try again.");
    }catch(e){
      if(++misses>=8)return fail("Lost contact with the server. Is uvicorn still running?");
    }
    setTimeout(tick,4000);
  };
  tick();
}
async function listWorkspaces(){
  try{const l=(await api("/tenants")).filter(t=>t.status==="ready");if(!l.length)return;
    $("#ws").innerHTML='<option value="">Choose a company</option>'+l.map(t=>`<option>${esc(t.id)}</option>`).join("");
    $("#existing").classList.remove("hidden")}catch{}
}
$("#ws").addEventListener("change",e=>e.target.value&&openTenant(e.target.value));
$("#switch").addEventListener("click",()=>{$("#app").classList.add("hidden");$("#gate").classList.remove("hidden");$("#go").disabled=false;$("#log").classList.add("hidden");listWorkspaces()});

/* ---------- workspace ---------- */
async function openTenant(id){
  T=await api("/tenants/"+id);cur="brief";
  $("#gate").classList.add("hidden");$("#app").classList.remove("hidden");
  $("#cname-h").textContent=T.brain?.company?.name||T.id;$("#dom").textContent=T.id;
  renderNav();render();
}
function renderNav(){
  $("#nav").innerHTML=`<button class="nav" data-k="brief" aria-current="${cur==="brief"}"><span class="av">Br</span><span>Company brief<small>What the team learned</small></span></button><div class="sep"></div>`+
   Object.entries(AGENTS).map(([k,[i,n,d]])=>`<button class="nav" data-k="${k}" aria-current="${cur===k}"><span class="av">${i}</span><span>${n}<small>${d}</small></span></button>`).join("");
  $("#nav").querySelectorAll(".nav").forEach(b=>b.onclick=()=>{cur=b.dataset.k;renderNav();render()});
}
const list=a=>a?.length?`<ul class="tight">${a.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:'<span class="mute">Not found</span>';
function render(){cur==="brief"?renderBrief():renderAgent(cur)}

function renderBrief(){
  const b=T.brain||{},c=b.company||{};
  $("#view").innerHTML=`
   <h2>${esc(c.name||T.id)}</h2><p class="sub">${esc(c.one_line_summary||"")}</p>
   ${T.error?`<div class="err">The last update failed: ${esc(T.error)}</div>`:""}
   <div class="sec"><h3>Language</h3>
    <p class="mute" style="margin-top:0">Every agent writes in one language. Changing it rewrites the playbooks and this message in the new language.</p>
    <div class="run" style="margin:0"><select id="lng" aria-label="Language">${["English","Hinglish","Hindi"].map(l=>`<option ${l===(T.language||"English")?"selected":""}>${l}</option>`).join("")}</select>
    <button class="btn ghost" id="lngbtn">Change language</button></div></div>
   <div class="sec"><h3>Message from your team</h3><pre class="welcome">${esc(T.welcome||"")}</pre></div>
   <div class="row2">
    <div class="sec"><h3>What you sell</h3>${list((b.offerings||[]).map(o=>o.name+": "+o.description))}</div>
    <div class="sec"><h3>Who you sell to</h3><div class="chips">${(b.icp||[]).map(i=>`<span class="chip">${esc(i.segment)}</span>`).join("")||'<span class="mute">Not found</span>'}</div></div>
    <div class="sec"><h3>Your edge</h3><p style="margin:0 0 8px">${esc(b.positioning?.value_proposition||"")}</p>${list(b.positioning?.differentiators)}</div>
    <div class="sec"><h3>Competitors</h3>${list((b.competitors||[]).map(x=>x.name+(x.gap_we_can_exploit?": "+x.gap_we_can_exploit:"")))}</div>
   </div>
   <div class="sec"><h3>Brand voice</h3><div class="chips">${(b.brand_voice?.tone_adjectives||[]).map(x=>`<span class="chip">${esc(x)}</span>`).join("")}</div></div>
   <div class="sec"><h3>Product rules</h3>
    <p class="mute" style="margin-top:0">The only things the content agent may say about each product. "Teach your team" never changes these. You see a diff before anything is saved.</p>
    <div id="rules"><span class="mute">Loading...</span></div>
    <p><button class="btn ghost" id="newrule">Add a product</button></p></div>
   <div class="sec"><h3>Teach your team</h3>
    <p class="mute" style="margin-top:0">Answer the open questions or fix anything that is wrong. Playbooks regenerate.</p>${list(b.open_questions)}
    <label for="corr">Your corrections</label><textarea id="corr" rows="3" placeholder="We sell to D2C brands, not enterprises."></textarea>
    <p><button class="btn" id="fix">Update the team</button></p></div>`;
  loadRules();$("#newrule").onclick=()=>editRule(null);
  $("#lngbtn").onclick=async()=>{
    const lang=$("#lng").value;if(lang===(T.language||"English"))return toast(`Already in ${lang}`);
    const btn=$("#lngbtn");btn.disabled=true;btn.textContent="Changing...";
    try{
      await post(`/tenants/${T.id}/language`,{language:lang});
      toast(`Rewriting the team's playbooks in ${lang}. This takes about a minute.`);
      for(let i=0;i<60;i++){
        await new Promise(r=>setTimeout(r,3000));
        const t=await api("/tenants/"+T.id);
        if(t.error){T=t;renderBrief();toast("Language change failed, see the message above.");return}
        if(t.language===lang){T=t;renderBrief();toast(`The team now writes in ${lang}`);return}
      }
      toast("Still working, reopen the company in a minute.");
    }catch(e){toast(e.message)}
    if($("#lngbtn")){$("#lngbtn").disabled=false;$("#lngbtn").textContent="Change language"}
  };
  $("#fix").onclick=async()=>{
    const v=$("#corr").value.trim();if(!v)return;
    const btn=$("#fix");btn.disabled=true;btn.textContent="Updating...";
    const before=JSON.stringify(T.brain);
    try{
      await post(`/tenants/${T.id}/confirm`,{corrections:v});
      toast("Updating the team. This takes about 30 seconds.");
      for(let i=0;i<40;i++){                       // wait for a real result, not a guess
        await new Promise(r=>setTimeout(r,3000));
        const t=await api("/tenants/"+T.id);
        if(t.error){T=t;renderBrief();toast("Update failed, see the message above.");return}
        if(JSON.stringify(t.brain)!==before){T=t;renderBrief();toast("Team updated");return}
      }
      toast("Still working, reopen the company in a minute.");
    }catch(e){toast(e.message)}
    if($("#fix")){$("#fix").disabled=false;$("#fix").textContent="Update the team"}
  }
}

async function renderAgent(a){
  const [,name]=AGENTS[a],pb=T.playbooks?.[a]||{};
  $("#view").innerHTML=`<h2>${name} agent</h2><p class="sub">${esc(pb.mission||(a==="content"?"Describe a campaign in plain English. You get video scripts, platform posts and questions for you, as drafts. Nothing is posted.":""))}</p>
   ${a==="content"?`<div class="cmd"><label for="cmd" style="margin-top:0">What do you need?</label>
   <textarea id="cmd" rows="3" placeholder="We're running a Facebook ad campaign for the Brightleaf Subscription. Give me the videos and structure."></textarea>
   <button class="btn" id="run">Make the package</button></div>`:`<div class="run">${a==="research"?"":`<input id="ins" placeholder="Optional: tell it what to focus on" aria-label="Instruction">`}
   <button class="btn" id="run">${a==="research"?"Find 10 companies now":"Run "+name.toLowerCase()}</button></div>`}
   <div id="work"></div><div id="out"></div>`;
  $("#run").onclick=()=>a==="content"?runCommand():runAgent(a);
  try{await loadOut(a)}
  catch(e){$("#out").innerHTML=`<div class="err">Could not load results: ${esc(e.message)}</div>`}
}
async function loadOut(a){
  const out=$("#out");if(!out)return;
  if(a==="research"){const d=await api(`/tenants/${T.id}/digest`);
    if(!d.length){out.innerHTML='<div class="sec mute">No companies yet. The first list arrives at 10:00 AM, or run it now.</div>';return}
    let day="",h='<div class="sec">';
    d.forEach(x=>{if(x.suggested_on!==day){day=x.suggested_on;h+=`<div class="day">${esc(day)}</div>`}
      h+=`<div class="co"><b>${esc(x.name)}</b><span class="score">${esc(x.relevance_score)}/10</span><p>${esc(x.why_relevant)}</p><p class="mute">Angle: ${esc(x.outreach_angle)}</p><p><a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.url)}</a></p></div>`});
    out.innerHTML=h+"</div>";return}
  const o=await api(`/tenants/${T.id}/outputs?agent=${a}`);
  if(a==="content"){out.innerHTML=o.length?o.map(pkgCard).join(""):'<div class="sec mute">No packages yet. Describe a campaign above.</div>';bindDecide(out);return}
  if(!o.length){out.innerHTML='<div class="sec mute">Nothing yet. Run the agent to get a first draft.</div>';return}
  out.innerHTML=o.map((x,i)=>`<div class="sec"><div class="meta"><span>${esc(x.created_at.slice(0,16).replace("T"," "))} UTC <span class="pill">Needs your approval</span></span><button class="btn ghost" data-c="${i}">Copy</button></div><div class="doc">${md(x.content)}</div></div>`).join("");
  out.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{navigator.clipboard.writeText(o[b.dataset.c].content);toast("Copied")});
}
async function runAgent(a){
  if(busy)return;busy=true;const btn=$("#run");btn.disabled=true;
  $("#work").innerHTML=`<div class="working"><span>${AGENTS[a][1]} agent is working. This can take a minute or two.</span><div class="bar"></div></div>`;
  let r=null;
  try{r=await post(`/tenants/${T.id}/agents/${a}/run`,{instruction:$("#ins")?.value||""});await loadOut(a)}
  catch(e){$("#out").insertAdjacentHTML("afterbegin",`<div class="err">${esc(e.message)}</div>`)}
  busy=false;if($("#work"))$("#work").innerHTML="";if($("#run"))$("#run").disabled=false;
  if(a==="research"&&r){let n=0;try{n=JSON.parse(r.output||"[]").length}catch{}
    if(!n)toast("No new companies this time. Try again, or set TAVILY_API_KEY in .env for reliable search.")}
}
async function runCommand(){
  const text=$("#cmd").value.trim();if(!text||busy)return;
  busy=true;$("#run").disabled=true;
  $("#work").innerHTML=`<div class="working"><span>Content agent is building the package. This can take a few minutes.</span><div class="bar"></div></div>`;
  try{const r=await post(`/tenants/${T.id}/command`,{text});$("#cmd").value="";await loadOut("content");if(r.warning)toast(r.warning)}
  catch(e){$("#out").insertAdjacentHTML("afterbegin",`<div class="err">${esc(e.message)}</div>`)}
  busy=false;if($("#work"))$("#work").innerHTML="";if($("#run"))$("#run").disabled=false;
}
function pkgCard(x){
  let d;try{d=JSON.parse(x.content)}catch{return `<div class="sec err">Could not read package ${x.id}</div>`}
  const p=d.package||{},s=p.campaign_summary||{},[st,cls]=STATUS[x.status]||[x.status,""];
  const field=(l,v)=>`<span class="lbl">${l}</span><p style="margin:2px 0 10px">${esc(v)}</p>`;
  const failed=(label,x)=>`<div class="vid"><h3>${label}</h3><div class="err">${esc(x.status)}: ${esc(x.error||"")}</div></div>`;
  const vid=(k,label)=>{const v=p.videos?.[k];if(!v)return"";if(v.status)return failed(label+" video",v);
    return `<div class="vid"><h3>${label} video <span class="mute" style="font-weight:400">${esc(v.duration_seconds)}s</span></h3>
     <div class="chips">${(v.aspect_ratios||[]).map(r=>`<span class="chip">${esc(r)}</span>`).join("")}</div>
     <ol class="scenes">${(v.scenes||[]).map(c=>`<li>${esc(c.line)}${c.on_screen_text?`<br><span class="lbl">On screen</span> ${esc(c.on_screen_text)}`:""}<br><span class="lbl">Visual</span> <span class="mute">${esc(c.visual)}</span></li>`).join("")}</ol>
     ${field("Caption",v.caption)}${v.shot_list?.length?`<span class="lbl">Shot list</span>${list(v.shot_list)}`:""}</div>`};
  return `<div class="sec" data-id="${x.id}">
   <div class="meta"><span>${esc(x.created_at.slice(0,16).replace("T"," "))} UTC <span class="pill ${cls}">${esc(st)}</span></span></div>
   <h3>${esc(d.request||"")}</h3>
   ${p.unverified_claims?.length?`<div class="err"><b>Unverified claims, remove before use</b><ul class="tight">${p.unverified_claims.map(u=>`<li>${esc(u.claim)} <span class="mute">(${esc(u.where||u.part)}: ${esc(u.reason)})</span></li>`).join("")}</ul></div>`:""}
   ${p.notes?.length?`<div class="note">${p.notes.map(esc).join("<br>")}</div>`:""}
   ${s.status?failed("Campaign summary",s):""}
   <div class="row2${s.status?" hidden":""}" style="margin-top:14px"><div>${field("Goal",s.goal)}${field("Audience",s.audience)}</div>
    <div>${field("Core message",s.core_message)}${field("Call to action",s.call_to_action)}</div></div>
   ${vid("hook","Hook")}${vid("short","Short")}${vid("explainer","Explainer")}
   ${p.posts?.status?failed("Posts",p.posts):""}${(Array.isArray(p.posts)?p.posts:[]).map(q=>`<div class="vid"><h3>${esc(PLAT[q.platform]||q.platform)} post</h3><p class="post">${esc(q.text)}</p>
     ${q.hashtags?.length?`<div class="chips" style="margin-top:8px">${q.hashtags.map(h=>`<span class="chip">${esc(h)}</span>`).join("")}</div>`:""}
     ${q.notes?`<p class="mute" style="margin:8px 0 0">${esc(q.notes)}</p>`:""}</div>`).join("")}
   ${p.article?.status?failed("Article",p.article):""}${p.article&&!p.article.status?`<div class="vid"><h3>Article: ${esc(p.article.title)}</h3>${list(p.article.outline)}<details><summary>Full draft</summary><div class="doc">${md(p.article.draft)}</div></details></div>`:""}
   ${p.sources?.length?`<div class="vid"><h3>Sources</h3><ul class="tight">${p.sources.map(r=>{const src=r.source||r.url||"";return `<li>${esc(r.claim)}${r.quote?` <span class="mute">"${esc(r.quote)}"</span>`:""}: ${/^https?:/.test(src)?`<a href="${esc(src)}" target="_blank" rel="noopener">${esc(src)}</a>`:esc(src)}</li>`}).join("")}</ul></div>`:""}
   ${p.open_questions?.length?`<div class="vid"><h3>Questions for you</h3>${list(p.open_questions)}</div>`:""}
   <div class="vid">${x.note?`<p class="mute" style="margin:0 0 8px">Your note: ${esc(x.note)}</p>`:""}
    <div class="run" style="margin:0"><input data-note placeholder="Optional note: what to keep or change" aria-label="Decision note">
    <button class="btn" data-d="approved">Approve</button><button class="btn ghost" data-d="rejected">Reject</button></div></div>
  </div>`;
}
function bindDecide(out){
  out.querySelectorAll("[data-d]").forEach(b=>b.onclick=async()=>{
    const card=b.closest("[data-id]"),btns=card.querySelectorAll("[data-d]");btns.forEach(x=>x.disabled=true);
    try{await api(`/tenants/${T.id}/outputs/${card.dataset.id}`,{method:"PATCH",headers:{"content-type":"application/json"},
        body:JSON.stringify({status:b.dataset.d,note:card.querySelector("[data-note]").value})});
      toast(b.dataset.d==="approved"?"Approved":"Rejected");await loadOut("content")}
    catch(e){toast(e.message);btns.forEach(x=>x.disabled=false)}});
}
const lines=a=>(a||[]).join("\n"),unlines=v=>v.split("\n").map(x=>x.trim()).filter(Boolean);
async function loadRules(){
  const box=$("#rules");if(!box)return;
  try{const rs=await api(`/tenants/${T.id}/offerings`);
    box.innerHTML=rs.length?rs.map((r,i)=>`<div class="rule"><h3>${esc(r.name)} <span class="mute" style="font-weight:400;font-size:13px">${esc(r.source)}</span></h3>
      <span class="lbl">Facts</span>${list(r.facts)}
      ${(r.claim_bank||[]).length?`<span class="lbl">Claim bank, the only sentences copy may use</span>${list(r.claim_bank)}`:""}
      ${r.not_yet_available.length?`<span class="lbl">Not yet available, never claim</span>${list(r.not_yet_available)}`:""}
      ${r.copy_rules.length?`<span class="lbl">Rules</span>${list(r.copy_rules)}`:""}
      ${r.never_claim_terms.length?`<span class="lbl">Never-claim terms</span><div class="chips" style="margin:6px 0">${r.never_claim_terms.map(x=>`<span class="chip">${esc(x)}</span>`).join("")}</div>`:""}
      <button class="btn ghost" data-r="${i}">Edit</button></div>`).join(""):'<span class="mute">No product rules yet.</span>';
    box.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>editRule(rs[b.dataset.r]));
  }catch(e){box.innerHTML=`<div class="err">${esc(e.message)}</div>`}
}
function editRule(r){
  const box=$("#rules"),isNew=!r;r=r||{name:"",facts:[],not_yet_available:[],copy_rules:[],never_claim_terms:[],claim_bank:[],source:"Company brief (provided by Varun)"};
  box.innerHTML=`<label for="rn" style="margin-top:0">Product name</label><input id="rn" value="${esc(r.name)}" ${isNew?"":"readonly"}>
    <label for="rf">Facts, one per line (the only claims copy may make)</label><textarea id="rf" rows="4">${esc(lines(r.facts))}</textarea>
    <label for="rb">Claim bank, one approved product sentence per line (copied word for word into copy)</label><textarea id="rb" rows="3">${esc(lines(r.claim_bank))}</textarea>
    <label for="ra">Not yet available, one per line</label><textarea id="ra" rows="3">${esc(lines(r.not_yet_available))}</textarea>
    <label for="rc">Rules for copy, one per line</label><textarea id="rc" rows="2">${esc(lines(r.copy_rules))}</textarea>
    <label for="rt">Never-claim terms, comma separated</label><input id="rt" value="${esc(r.never_claim_terms.join(", "))}">
    <label for="rs">Source label</label><input id="rs" value="${esc(r.source)}">
    <div id="rdiff"></div>
    <p style="display:flex;gap:10px"><button class="btn" id="rprev">Preview changes</button><button class="btn ghost" id="rcancel">Cancel</button></p>`;
  const read=()=>({name:$("#rn").value.trim(),facts:unlines($("#rf").value),not_yet_available:unlines($("#ra").value),
    copy_rules:unlines($("#rc").value),never_claim_terms:$("#rt").value.split(",").map(x=>x.trim()).filter(Boolean),claim_bank:unlines($("#rb").value),source:$("#rs").value.trim()});
  $("#rcancel").onclick=loadRules;
  $("#rprev").onclick=async()=>{
    const rule=read();
    try{const p=await post(`/tenants/${T.id}/offerings/preview`,rule);
      if(!p.changed){$("#rdiff").innerHTML='<div class="note">No changes to save.</div>';return}
      $("#rdiff").innerHTML=`<div class="diff">${p.diff.split("\n").map(l=>`<span class="${l.startsWith("+")?"add":l.startsWith("-")?"del":""}">${esc(l)}</span>`).join("\n")}</div>
        <p><button class="btn" id="rsave">Save these changes</button></p>`;
      $("#rsave").onclick=async()=>{
        try{await api(`/tenants/${T.id}/offerings`,{method:"PUT",headers:{"content-type":"application/json"},body:JSON.stringify({rule,base_version:p.base_version})});
          toast("Product rules saved");loadRules()}
        catch(e){$("#rdiff").innerHTML=`<div class="err">${esc(e.message)}</div>`}};
    }catch(e){$("#rdiff").innerHTML=`<div class="err">${esc(e.message)}</div>`}
  };
}
listWorkspaces();
</script>
